[package]
name = "datafusion-distributed-iceberg-test-tools"
version = "0.1.0"
edition = "2024"
description = "Builders for the Iceberg tables used in tests"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"
publish = false

[dependencies]
# Only for its Arrow and Parquet re-exports, which keep this crate on the
# versions the rest of the workspace resolves to.
datafusion = { workspace = true, features = ["parquet", "sql"] }
# The test harness runs distributed queries on in-memory workers.
datafusion-distributed = { path = "../..", features = ["integration"] }
datafusion-proto = { workspace = true }
# Match datafusion-distributed-iceberg's iceberg-rust source so tables share one type.
iceberg = { git = "https://github.com/DataDog/iceberg-rust", branch = "alex.bianchi/datafusion-55-pr-3081-column-stats" }
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_pcg = "0.10"
tempfile = "3.18"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
