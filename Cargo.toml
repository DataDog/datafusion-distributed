[workspace]
members = [
    "datafusion/datasets",
    "datafusion/distributed",
    "datafusion/distributed-benchmarks",
    "datafusion/distributed-cli",
    "datafusion/distributed-console",
    "datafusion/distributed-iceberg",
    "datafusion/distributed-iceberg-benchmarks",
    "datafusion/distributed-iceberg-test-tools",
    "datafusion/distributed-remote-worker",
]
# Plain `cargo build`/`cargo test` from the repository root target the core library.
default-members = ["datafusion/distributed"]
resolver = "3"

[workspace.dependencies]
datafusion = { git = "https://github.com/apache/datafusion.git", rev = "1635ed94742c1c060852bc34dc6ebb2302241c7b", default-features = false }
datafusion-proto = { git = "https://github.com/apache/datafusion.git", rev = "1635ed94742c1c060852bc34dc6ebb2302241c7b", default-features = false }

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed-methods = "deny"

# datafusion-iceberg pins apache/iceberg-rust at an older Arrow 60 revision. Resolve it to the
# same revision as this workspace (apache/iceberg-rust 13f84f9: that revision plus FileScanTask
# column statistics, #3424) so FileScanTask is one type. Drop this once datafusion-iceberg
# depends on a revision with both.
[patch."https://github.com/apache/iceberg-rust.git"]
iceberg = { git = "https://github.com/DataDog/iceberg-rust.git", rev = "13f84f93f1a09619f473b788b2a88ef1da0c7102" }
iceberg-storage-opendal = { git = "https://github.com/DataDog/iceberg-rust.git", rev = "13f84f93f1a09619f473b788b2a88ef1da0c7102" }
