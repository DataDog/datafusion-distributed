[workspace]
members = ["benchmarks", "cli", "console"]

[workspace.dependencies]
datafusion = { version = "53.1.0", default-features = false }
datafusion-proto = { version = "53.1.0" }

[package]
name = "datafusion-distributed"
version = "1.0.0"
edition = "2024"
description = "Framework for enhancing Apache DataFusion with distributed capabilities"
license = "Apache-2.0"
documentation = "https://datafusion-contrib.github.io/datafusion-distributed/"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[dependencies]
chrono = { version = "0.4.44" }
datafusion = { workspace = true, features = [
  "parquet",
  "sql",
  "unicode_expressions",
  "datetime_expressions",
] }
datafusion-proto = { workspace = true }
arrow-flight = "58"
arrow-select = "58"
arrow-ipc = { version = "58", features = ["zstd"] }
async-trait = "0.1.89"
tokio = { version = "1.48", features = ["full"] }
tonic = { version = "0.14.1", features = ["transport"] }
tower = "0.5.2"
http = "1.3.1"
itertools = "0.14.0"
futures = "0.3.31"
url = "2.5.7"
uuid = "1.19"
delegate = "0.13.4"
dashmap = "6.0.1"
prost = "0.14.1"
rand = "0.9"
object_store = "0.13"
bytes = "1.11"
pin-project = "1.1.10"
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7"
moka = { version = "0.12", features = ["sync", "future"] }
crossbeam-queue = "0.3"
sysinfo = { version = "0.30", optional = true }
sketches-ddsketch = { version = "0.3", features = ["use_serde"] }
bincode = "1"
tonic-prost = "0.14.2"

# integration_tests deps
insta = { version = "1.46.0", features = ["filters"], optional = true }
parquet = { version = "58", optional = true }
arrow = { version = "58", optional = true, features = ["test_utils"] }
hyper-util = { version = "0.1.16", optional = true }

[features]
avro = ["datafusion/avro"]
integration = ["insta", "parquet", "arrow", "hyper-util"]

system-metrics = ["sysinfo"]

tpch = ["integration"]
tpcds = ["integration"]
clickbench = ["integration"]
sysinfo = ["dep:sysinfo"]

[dev-dependencies]
datafusion-distributed-benchmarks = { path = "benchmarks" }
structopt = "0.3"
insta = { version = "1.46.0", features = ["filters"] }
parquet = "58"
arrow = { version = "58", features = ["test_utils"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
hyper-util = "0.1.16"
pretty_assertions = "1.4"
test-case = "3.3.1"

[workspace.lints.clippy]
disallowed_types = "deny"
disallowed-methods = "deny"

[patch.crates-io]
datafusion = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion" }
datafusion-datasource = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-datasource" }
datafusion-proto = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-proto" }
datafusion-proto-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-proto-common" }
datafusion-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-common" }
datafusion-common-runtime = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-common-runtime" }
datafusion-doc = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-doc" }
datafusion-execution = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-execution" }
datafusion-expr = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-expr" }
datafusion-expr-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-expr-common" }
datafusion-functions = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-functions" }
datafusion-functions-aggregate-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-functions-aggregate-common" }
datafusion-functions-window-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-functions-window-common" }
datafusion-macros = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-macros" }
datafusion-physical-expr = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-physical-expr" }
datafusion-physical-expr-common = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-physical-expr-common" }
datafusion-physical-plan = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-physical-plan" }
datafusion-sql = { git = "https://github.com/DataDog/datafusion", rev = "c96c28523976de3f09da9f865e999e81910ec464", package = "datafusion-sql" }