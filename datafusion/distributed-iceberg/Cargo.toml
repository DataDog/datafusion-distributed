[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only Apache Iceberg table providers for DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-proto = { workspace = true }
# apache/iceberg-rust 13f84f9: Arrow 60 plus FileScanTask column statistics (#3424). The commit is
# fetched from DataDog/iceberg-rust, which mirrors upstream; the workspace [patch] points
# datafusion-iceberg at it too so FileScanTask is one type.
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg.git", rev = "5398be196e47ef42543f6e9c72d15cad898e5143" }
futures = "0.3"
iceberg = { git = "https://github.com/DataDog/iceberg-rust.git", rev = "13f84f93f1a09619f473b788b2a88ef1da0c7102" }
iceberg-storage-opendal = { git = "https://github.com/DataDog/iceberg-rust.git", rev = "13f84f93f1a09619f473b788b2a88ef1da0c7102", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
datafusion-distributed = { path = "../distributed", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
rmp-serde = "1.3"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
datafusion-distributed-iceberg-test-tools = { path = "../distributed-iceberg-test-tools" }
tempfile = "3"
insta = "1"
parquet = "60"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
