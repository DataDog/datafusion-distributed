[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only Apache Iceberg table providers for DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-proto = { workspace = true }
# DataDog's iceberg-rust build of upstream main (Arrow 59), which exposes per-file column statistics on
# FileScanTask (apache/iceberg-rust#3424). The workspace [patch] makes datafusion-iceberg use the same
# source so FileScanTask is one shared type.
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg.git", rev = "20327db58c7a44330366da00a34a26e866d0da4d" }
futures = "0.3"
iceberg = { git = "https://github.com/DataDog/iceberg-rust", rev = "7fda030197a61057422b12ca4cf2cc783a5607f0" }
iceberg-storage-opendal = { git = "https://github.com/DataDog/iceberg-rust", rev = "7fda030197a61057422b12ca4cf2cc783a5607f0", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
datafusion-distributed = { path = "../distributed", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
rmp-serde = "1.3"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
datafusion-distributed-iceberg-test-tools = { path = "../distributed-iceberg-test-tools" }
tempfile = "3"
insta = "1"
parquet = "59"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
